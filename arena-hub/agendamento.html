<!DOCTYPE html>
<html lang="pt-BR">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>ArenaHub | Agendar</title>
  <link rel="stylesheet" href="css/style.css">
  <link rel="stylesheet" href="css/agendamentos.css">
</head>

<body>
  <header>
    <a class="logo" href="index.html">ArenaHub</a>
    <nav aria-label="Navegação principal">
      <ul class="menu">
        <li><a href="index.html">Início</a></li>
        <li><a href="quadras.html">Quadras</a></li>
        <li><a href="agendamentos.html">Agendamentos</a></li>
      </ul>
    </nav>
  </header>

  <main>
    <section>
      <h1 id="titulo-form">Novo agendamento</h1>
      <form id="form" novalidate>
        <input type="hidden" id="id">

        <label for="nome">Nome *</label>
        <input type="text" id="nome" required minlength="3" maxlength="80">

        <label for="email">E-mail *</label>
        <input type="email" id="email" required>

        <label for="telefone">Telefone</label>
        <input type="tel" id="telefone" inputmode="numeric" placeholder="82999990000" maxlength="11">

        <label for="quadraId">Quadra *</label>
        <select id="quadraId" required></select>

        <label for="data">Data *</label>
        <input type="date" id="data" required>

        <fieldset>
          <legend>Horários *</legend>
          <div class="opcoes" id="horarios"></div>
        </fieldset>

        <p><strong id="valor-total">Valor total: R$ 0</strong></p>

        <p>
          <button type="submit" class="btn" id="btn-salvar">Confirmar agendamento</button>
          <a class="btn btn-secundario" href="quadras.html">Voltar</a>
        </p>
        <p id="mensagem" role="status"></p>
      </form>
    </section>
  </main>

  <footer>
    <p>ArenaHub · suporte@arenahub.com.br · (82) 3000-0000</p>
    <p>&copy; 2026 ArenaHub</p>
  </footer>

  <script src="js/agendamento.js"></script>
</body>

</html>
